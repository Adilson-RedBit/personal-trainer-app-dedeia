<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Meu Treino Dedeia">
    <title>Meu Treino Dedeia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 300px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }

        svg {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 16px 32px;
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.3);
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .btn:active {
            transform: scale(0.98);
            box-shadow: 0 4px 10px rgba(255, 107, 53, 0.2);
        }

        .instructions {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
            line-height: 1.6;
        }

        .instructions strong {
            color: #FF6B35;
            display: block;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- Haltere -->
                <circle cx="6" cy="12" r="2"/>
                <circle cx="18" cy="12" r="2"/>
                <rect x="8" y="10" width="8" height="4" rx="1"/>
                <path d="M4 12h2M18 12h2M6 8v8M18 8v8"/>
            </svg>
        </div>

        <h1>Meu Treino Dedeia</h1>
        <p class="subtitle">Seu app de musculação</p>

        <a href="https://github.com/Adilson-RedBit/personal-trainer-app-dedeia" class="btn">
            Abrir Treinos
        </a>

        <div class="instructions">
            <strong>📌 Para fixar no celular:</strong>
            <div>iPhone: Toque o botão de compartilhar → "Adicionar à Tela Inicial"</div>
            <div style="margin-top: 8px;">Android: Toque ⋮ → "Instalar app"</div>
        </div>
    </div>
</body>
</htm
